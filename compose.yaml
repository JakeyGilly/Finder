services:
  finder.bot:
    image: finder.bot
    build:
      context: .
      dockerfile: Finder.Bot/Dockerfile
    environment:
        - DOTNET_ENVIRONMENT=Production
        - ConnectionStrings__PostgreSQL=Host=postgres;Port=5432;Database=finderbot;Username=postgres;Password=${FINDER_BOT_DB_PASSWORD}
        - BotToken=${BOT_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
  finder.web:
    image: finder.web
    build:
      context: .
      dockerfile: Finder.Web/Dockerfile
    environment:
        - ASPNETCORE_ENVIRONMENT=Production
        - DOTNET_ENVIRONMENT=Production
        - ASPNETCORE_URLS=http://+:5000
        - ConnectionStrings__PostgreSQL=Host=postgres;Port=5432;Database=finderbot;Username=postgres;Password=${FINDER_BOT_DB_PASSWORD}
        - DiscordClientSecret=${DISCORD_CLIENT_SECRET}
        - DiscordClientId=${DISCORD_CLIENT_ID}
        - DiscordBotToken=${BOT_TOKEN}
        - BotOwnerIds__0=${BOT_OWNER_ID_1}
        - BotOwnerIds__1=${BOT_OWNER_ID_2}
    ports:
      - "80:5000"
    volumes:
      - finderbot-dataprotection:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:latest
    container_name: finderbot-postgres
    environment:
      POSTGRES_DB: finderbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${FINDER_BOT_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - finderbot-postgres-data:/var/lib/postgresql,
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d finderbot" ]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  finderbot-postgres-data:
  finderbot-dataprotection:
